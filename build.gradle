buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.baseline-error-prone:gradle-baseline-error-prone:0.7.0'
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.6.0'
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.73.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.26.0'
        classpath 'com.palantir.gradle.plugintesting:gradle-plugin-testing:0.6.0'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:1.33.0'
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.18.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.86.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:2.28.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.8.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:7.0.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:4.3.0'
        classpath 'com.palantir.gradle.guide:gradle-guide:1.27.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.8.0'
        classpath 'com.palantir.gradle.idea-language-injector:gradle-idea-language-injector:0.2.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    }
}

plugins {
    id 'com.gradle.plugin-publish' version '2.0.0'
}
allprojects {
    apply plugin: 'com.palantir.java-format'
    apply plugin: 'com.palantir.jakarta-package-alignment'
}

repositories {
    mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
}

apply plugin: 'com.palantir.external-publish'
apply plugin: 'java-gradle-plugin'
apply plugin: 'groovy'
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.baseline-error-prone-root'
apply plugin: 'com.palantir.consistent-versions'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.gradle-guide'
apply plugin: 'com.palantir.gradle-plugin-testing'
apply plugin: 'com.palantir.idea-language-injector'
apply plugin: 'com.palantir.jdks'
apply plugin: 'com.palantir.external-publish-jar'
apply plugin: 'com.palantir.failure-reports'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.jdks.latest'

group = 'com.corevaultsolutions.gradle.docker'
// gitVersion() derives the version from git tags, so it works on any CI (and locally)
// without a CI-specific tag environment variable.
version = gitVersion()

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    api gradleApi()

    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    plugins {
        dockerPlugin {
            id = 'com.corevaultsolutions.docker'
            displayName = 'CoreVault Gradle Docker'
            implementationClass = 'com.corevaultsolutions.gradle.docker.CoreVaultDockerPlugin'
            description = 'Simple Docker orchestrator for executing docker build and push from within Gradle.'
        }
        dockerComposePlugin {
            id = 'com.corevaultsolutions.docker-compose'
            displayName = 'CoreVault Gradle Docker-Compose'
            implementationClass = 'com.corevaultsolutions.gradle.docker.DockerComposePlugin'
            description = 'Docker Compose orchestrator for docker-compose up/down from within Gradle.'
        }
        dockerRunPlugin {
            id = 'com.corevaultsolutions.docker-run'
            displayName = 'CoreVault Gradle Docker-Run'
            implementationClass = 'com.corevaultsolutions.gradle.docker.DockerRunPlugin'
            description = 'Docker Run task orchestrator for running containers from within Gradle.'
        }
    }
}

publishPlugins.onlyIf { versionDetails().isCleanTag }

// Configure the publishPlugins task
tasks.publish.dependsOn publishPlugins
project.ext.'gradle.publish.key' = System.env["GRADLE_KEY"]
project.ext.'gradle.publish.secret' = System.env["GRADLE_SECRET"]

javaVersions {
    javaCompiler = 25
    libraryTarget = 17
}

jdks {
    daemonTarget = 21
}

gradleTestUtils {
    gradleVersions = ['8.14.5', '9.0.0', '9.5.1']
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // GradleRunner.withDebug(true) runs TestKit builds in-process, so the test JVM must open
    // java.lang.invoke for the configuration-cache lambda (de)serialization that real daemons do.
    jvmArgs '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
}
